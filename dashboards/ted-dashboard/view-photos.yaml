# View: Photos — placeholder (custom:grid-layout). path: photos
# Uses the Welcome view's clock + content layout. The content area holds a
# MessageBox card as the placeholder. Navbar is a plain card (position:fixed).
type: custom:grid-layout
path: photos
title: Photos
icon: streamline-ultimate-color:picture-stack-landscape
layout:
  height: calc(100dvh - var(--kiosk-header-height, var(--header-height, 56px)) - var(--safe-area-inset-top, 0px) - var(--ted-navbar-bottom-reserve, 48px))
  grid-template-columns: 1fr
  grid-template-rows: >-
    minmax(100px, calc((100dvh - var(--kiosk-header-height, var(--header-height, 56px)) - var(--safe-area-inset-top, 0px) - var(--ted-navbar-bottom-reserve, 48px)) * 0.25))
    calc((100dvh - var(--kiosk-header-height, var(--header-height, 56px)) - var(--safe-area-inset-top, 0px) - var(--ted-navbar-bottom-reserve, 48px)) * 0.75)
  grid-template-areas: |
    "clock"
    "content"
  grid-gap: 12px
  padding: 12px
  box-sizing: border-box
cards:
  - type: custom:ted-clock-weather-card
    clock_size: custom
    clock_size_custom: 95
    weather_size: custom
    weather_size_custom: 95
    date_size: custom
    date_size_custom: 95
    view_layout:
      grid-area: clock
    card_mod:
      style: |
        .cwc {
          padding: 8px !important;
        }
  - type: custom:ted-messagebox-card
    view_layout:
      grid-area: content
    severity: info
    icon: streamline-ultimate-color:picture-stack-landscape
    title: Photos
    message: This is a placeholder view. Content coming soon.
  - !include navbar.yaml
