# View: Calendar-WeekView (custom:grid-layout) — path: calendar-week
# Navbar is a plain card in `cards:` (`- !include navbar.yaml`); it's position:fixed so it
# needs no grid-area.
#
# Effective view height = viewport - navbar - header, where the "header" term is
#   var(--kiosk-header-height, var(--header-height, 56px))
# kiosk-mode sets --kiosk-header-height:0 on #view (so kiosk = viewport - navbar),
# while non-kiosk falls back to the real --header-height (so = viewport - navbar - header).
# Clock: min 100px, max 25% of that height. Calendar: 75% of that height.
type: custom:grid-layout
path: calendar-week
title: Calendar-WeekView
icon: streamline-ultimate-color:calendar-date
layout:
  height: calc(100dvh - var(--kiosk-header-height, var(--header-height, 56px)) - var(--safe-area-inset-top, 0px) - var(--ted-navbar-bottom-reserve, 48px))
  grid-template-columns: 1fr
  grid-template-rows: >-
    minmax(100px, calc((100dvh - var(--kiosk-header-height, var(--header-height, 56px)) - var(--safe-area-inset-top, 0px) - var(--ted-navbar-bottom-reserve, 48px)) * 0.25))
    calc((100dvh - var(--kiosk-header-height, var(--header-height, 56px)) - var(--safe-area-inset-top, 0px) - var(--ted-navbar-bottom-reserve, 48px)) * 0.75)
  grid-template-areas: |
    "clock"
    "calendar"
  grid-gap: 12px
  padding: 12px
  box-sizing: border-box
cards:
  - !include clock-header.yaml
  - type: vertical-stack
    cards:
      - title: Family Calendar
        entities:
          - calendar.holidays_in_united_states
          - calendar.birthdays_2
          - calendar.family
          - calendar.chanisha_s_gmail_com
          - calendar.ted_outlook_calendar
          - calendar.hockey_canadian_bacon
          - calendar.hockey_maple_bars
        default_view: week
        first_day_of_week: 0
        week_days:
          - 0
          - 1
          - 2
          - 3
          - 4
          - 5
          - 6
        week_start_hour: 6
        week_end_hour: 23
        lock_schedule_hours: true
        hide_the_past: false
        past_event_mode: muted
        disable_swipe_controls: false
        show_all_events_month: false
        show_all_details_month: false
        hide_empty_days: false
        agenda_compact_events: true
        shorten_event_times: true
        display_full_weekday_names: false
        compact_width: true
        show_current_time_bar: true
        show_event_location: true
        use_short_location: true
        event_location_font_size: 9
        background_opacity: 0
        header_background_opacity: 0
        event_calendar_friendly_name: false
        event_title_prefix: none
        combine_style: bars
        combine_background: primary
        event_color_mode: left-tint
        event_neutral_background: "#F8F3E9"
        event_tint_opacity: 80
        event_color_bar_width: 6
        day_badges: []
        hide_calendars: true
        hide_header: true
        hide_year: false
        hide_controls: true
        hide_navigation_buttons: false
        hide_add_event_button: false
        hide_view_selector: false
        hide_dark_mode_toggle: false
        show_dashboard_nav_button: false
        header_dashboard_path: null
        header_weather_sensor: weather.forecast_home
        calendar_person_entities:
          calendar.chanisha_s_gmail_com: person.chanisha_somatilaka
          calendar.ted_outlook_calendar: person.ted_roberts
          calendar.family: person.wallpanel
        default_hidden_calendars: []
        color_scheme: auto
        enable_event_management: true
        event_modal_size: medium
        type: custom:daylight-calendar-card
        rolling_days_week_compact: 5
        rolling_days_schedule: 6
        rolling_days_agenda: 4
        compact_height: true
        compact_header: true
        hide_calendar_names: true
        header_background_transparent: false
        background_transparent: false
        colors:
          calendar.birthdays_2: "#00c700"
          calendar.chanisha_s_gmail_com: "#9c5fff"
          calendar.family: "#738eb0"
          calendar.hockey_canadian_bacon: "#0050ff"
          calendar.hockey_maple_bars: "#0050ff"
          calendar.holidays_in_united_states: "#F7DC6F"
          calendar.ted_outlook_calendar: "#43a1ce"
        calendar_names:
          calendar.chanisha_s_gmail_com: Chanisha Calendar
          calendar.ted_outlook_calendar: Ted Calendar
        combine_calendars: true
        combine_calendars_width: 6
        readonly_calendars:
          - calendar.birthdays_2
          - calendar.chanisha_s_gmail_com
          - calendar.hockey_canadian_bacon
          - calendar.hockey_maple_bars
          - calendar.holidays_in_united_states
          - calendar.ted_outlook_calendar
        virtual_calendars:
          - id: virtual_1
            name: Ted
            icon: null
            color: "#578eb5"
            entities:
              - calendar.hockey_canadian_bacon
              - calendar.hockey_maple_bars
              - calendar.ted_outlook_calendar
        hide_times_for_calendars:
          - calendar.holidays_in_united_states
          - calendar.birthdays_2
        calendar_badge_icons:
          calendar.holidays_in_united_states: mdi:beach
          calendar.birthdays_2: mdi:balloon
    view_layout:
      grid-area: calendar
    card_mod:
      style: >
        .calendar-container {
          height: calc((100dvh - var(--kiosk-header-height, var(--header-height, 56px)) - var(--safe-area-inset-top, 0px) - var(--ted-navbar-bottom-reserve, 48px)) * 0.75) !important;
          max-height: calc((100dvh - var(--kiosk-header-height, var(--header-height, 56px)) - var(--safe-area-inset-top, 0px) - var(--ted-navbar-bottom-reserve, 48px)) * 0.75) !important;
          min-height: 0 !important;
          overflow: hidden !important;
        }

        .week-standard-container, .agenda-container, .calendar-grid,
        .week-compact-container {
          height: 100% !important;
          max-height: 100% !important;
          overflow-y: auto !important;
        }
  - !include navbar.yaml
