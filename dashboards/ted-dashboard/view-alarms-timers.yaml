# View: Alarms-Timers (custom:grid-layout) — path: alarms-timers
# A single full-height Ted's Tab Card holding the Alarms + Timers tabs. Each tab's content
# starts with a centered "Add" button (custom:ted-button-card, horizontal orientation) that
# fires an `ll-custom` DOM event (action: fire-dom-event); the alarm/timer card in the same
# tab listens for it to open its add dialog. Deep-link a tab with `?tab=alarms` / `?tab=timers`.
# Navbar is a plain card in `cards:` (`- !include navbar.yaml`); it's position:fixed so
# it needs no grid-area.
type: custom:grid-layout
path: alarms-timers
title: Alarms-Timers
icon: streamline-ultimate-color:time-clock-circle
layout:
  height: calc(100dvh - var(--ted-navbar-bottom-reserve, 48px))
  grid-template-columns: 1fr
  grid-template-rows: minmax(0, 1fr)
  grid-template-areas: |
    "tabs"
  grid-gap: 12px
  padding: 12px
  box-sizing: border-box
cards:
  - type: custom:ted-tab-card
    view_layout:
      grid-area: tabs
    scale: 125
    default_tab: 0
    url_param: tab
    tabs:
      - label: Alarms
        icon: mdi:alarm
        slug: alarms
        card:
          type: vertical-stack
          cards:
            - type: custom:ted-button-card
              name: + Add Alarm
              show_name: true
              icon: mdi:alarm-plus
              icon_color: none
              width: 200
              height: 48
              theme: ha
              tap_action:
                action: fire-dom-event
                ted_add: alarm
              element_order:
                - icon
                - name
                - state
              orientation: horizontal
              show_icon: false
            - type: custom:ted-alarm-card
              show_add: false
              show_header_icon: false
              show_header_name: false
      - label: Timers
        icon: mdi:timer-outline
        slug: timers
        card:
          type: vertical-stack
          cards:
            - type: custom:ted-button-card
              name: + Add Timer
              show_name: true
              show_icon: false
              orientation: horizontal
              icon: mdi:timer-plus-outline
              icon_scale: 100
              icon_color: none
              width: 200
              height: 48
              theme: ha
              element_order:
                - icon
                - name
                - state
              tap_action:
                action: fire-dom-event
                ted_add: timer
            - type: custom:ted-timer-card
              show_add: false
              show_header_icon: false
              show_header_name: false
  - !include navbar.yaml
