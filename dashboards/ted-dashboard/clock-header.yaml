# Shared clock/weather header — the SINGLE source for the "clock" grid area
# across every standard view. Each view pulls it with:
#   - !include clock-header.yaml   (relative to this directory)
# It positions itself into the view's `clock` grid area, so any consuming view
# must define a `clock` row in its `grid-template-areas`.
# (home-nightstand keeps its own bespoke split layout and does NOT use this.)
type: custom:ted-clock-weather-card
clock_size: custom
clock_size_custom: 95
weather_size: custom
weather_size_custom: 95
date_size: custom
date_size_custom: 95
view_layout:
  grid-area: clock
card_mod:
  style: |
    /* The clock fills its grid cell, so give it a definite height (its usual ~25%
       band, floored at 100px). This lets consuming views size the "clock" row with
       `auto` — the card drives the row height when present, and the row collapses to
       0 when a view omits the clock, so `content` can take the full height. */
    :host {
      height: max(100px, calc((100dvh - var(--kiosk-header-height, var(--header-height, 56px)) - var(--safe-area-inset-top, 0px) - var(--ted-navbar-bottom-reserve, 48px)) * 0.25)) !important;
    }
    .cwc {
      padding: 8px !important;
    }
