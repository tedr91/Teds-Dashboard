# Rings a looping sound when a Ted's Cards Backend alarm or timer completes,
# and stops automatically when THAT specific completion notification is dismissed
# (Dismiss/Snooze on the card or its action buttons). Exact-item matched, so
# alarms/timers in different rooms ring independently.
#
# SETUP:
#   1. Put sound files in config/www/sounds/  ->  served at /local/sounds/...
#   2. Set clip_seconds to the real length of your clip (tight loop cadence).
#   3. Fill the `player` map: HA area id -> media_player entity to play on.
#
# WHY trigger on the notification event (not *_alarm_ringing / *_timer_finished):
#   The backend fires the ringing event and then the notification event back to
#   back. Only the notification payload carries the notification `id` AND `source`
#   /`area`/`message`, and the dismiss event ({id, dismissed:true}) matches by that
#   same id — so this is race-free and lets us stop the exact item that rang.

alias: Teds - Ring sound until alarm/timer dismissed
mode: parallel        # different rooms can ring at the same time
max: 10
triggers:
  - trigger: event
    event_type: teds_cards_backend_notification
conditions:
  # Only completion notifications (creation payload has `source`; the dismiss
  # payload does not, so it is skipped here).
  - condition: template
    value_template: "{{ trigger.event.data.source in ['alarm', 'timer'] }}"
variables:
  clip_seconds: 5     # <-- length of your sound file, in seconds
  nid: "{{ trigger.event.data.id }}"
  area: "{{ trigger.event.data.area }}"
  # HA area id -> media_player entity. Edit these to match your setup.
  player: >-
    {% set m = {
      'primary_bedroom': 'media_player.primary_bedroom_speaker',
      'kitchen':         'media_player.kitchen_speaker'
    } %}
    {{ m.get(area, 'media_player.house_default') }}
  clip: >-
    {{ '/local/sounds/alarm.mp3' if trigger.event.data.source == 'alarm'
       else '/local/sounds/timer.mp3' }}
actions:
  - repeat:
      count: 180      # safety cap (~180 * clip_seconds); loop also exits on dismiss
      sequence:
        - action: media_player.play_media
          target:
            entity_id: "{{ player }}"
          data:
            media_content_id: "{{ clip }}"
            media_content_type: music
            announce: false
        # Wait for THIS notification's dismissal; otherwise time out one clip
        # length and play again.
        - wait_for_trigger:
            - trigger: event
              event_type: teds_cards_backend_notification
              event_data:
                id: "{{ nid }}"
                dismissed: true
          timeout: "{{ clip_seconds }}"
          continue_on_timeout: true
        - if: "{{ wait.trigger is not none }}"   # dismissed -> stop looping
          then:
            - stop: "Dismissed"
  - action: media_player.media_stop            # runs on dismiss or after the cap
    target:
      entity_id: "{{ player }}"
