# View: Home (Wall Panel — Landscape) — placeholder (custom:grid-layout). path: home-wallpanel-h
# Uses the Welcome view's clock + content layout. The content area holds a
# MessageBox card as the placeholder. Navbar is a plain card (position:fixed).
type: custom:grid-layout
path: home-wallpanel-h
title: Home (Wall Panel Landscape)
icon: streamline-ultimate-color:e-commerce-touch-buy
layout: !include ../shared/layout-clock-content.yaml
cards:
  - !include ../shared/clock-header.yaml
  # Full-height week calendar in the "content" grid-area, rendered by
  # custom:ted-calendar-card (wraps daylight-calendar-card; fill:true sizes it to the
  # content cell). Calendars come from Settings → Calendars (falling back to Ted's
  # baked-in defaults). Per-view overrides (chrome-less week layout) go in calendar_config.
  - type: custom:ted-calendar-card
    view_layout:
      grid-area: content
    calendar_source: settings
    default_view: week
    fill: true
    calendar_config:
      hide_header: true
      hide_calendars: true
      hide_controls: true
      rolling_days_week_compact: 5
  - !include ../shared/navbar.yaml
  - !include ../shared/background.yaml