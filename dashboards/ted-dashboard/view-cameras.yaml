# View: Cameras — Ted's Camera Card driven by the per-device Settings list. path: cameras
# The camera card fills the "content" grid-area (like the calendar in Calendar-Month).
# Cameras are chosen per-device in Settings → Cameras; when a device has none available
# the card shows its own empty-state prompt with a "Settings" button. Navbar is a plain
# card (`- !include navbar.yaml`), position:fixed so it needs no grid-area.
type: custom:grid-layout
path: cameras
title: Cameras
icon: streamline-ultimate-color:shield-monitor
layout:
  height: calc(100dvh - var(--kiosk-header-height, var(--header-height, 56px)) - var(--safe-area-inset-top, 0px) - var(--ted-navbar-bottom-reserve, 48px))
  grid-template-columns: 1fr
  grid-template-rows: >-
    minmax(0, auto)
    minmax(0, 1fr)
  grid-template-areas: |
    "clock"
    "content"
  grid-gap: 12px
  padding: 12px
  box-sizing: border-box
cards:
  - type: custom:ted-camera-card
    view_layout:
      grid-area: content
    cameras_source: settings
    layout: auto
    fill: true
    show_name: true
  - !include navbar.yaml
