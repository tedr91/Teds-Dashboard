# View: Home (Nightstand) — placeholder (custom:grid-layout). path: home-nightstand
# Content (left) + clock (right) side-by-side. Clock is at least 60% wide; the
# content column uses fit-content(40%) so it caps at 40% when it holds a card but
# COLLAPSES TO 0 when empty (letting the clock span the full width). Content sits on
# the LEFT so the clock area reaches the screen's RIGHT edge — the top-right weather
# then gets uniform top/right padding (with content on the right, the grid-gap added
# an extra ~12px only on the right). The navbar auto-hides on this view.
type: custom:grid-layout
path: home-nightstand
title: Home (Nightstand)
icon: cbi:echo-show-5-gen-2
layout:
  height: calc(100dvh - var(--kiosk-header-height, var(--header-height, 56px)) - var(--safe-area-inset-top, 0px) - var(--ted-navbar-bottom-reserve, 48px))
  grid-template-columns: fit-content(40%) minmax(60%, 1fr)
  grid-template-rows: calc(100dvh - var(--kiosk-header-height, var(--header-height, 56px)) - var(--safe-area-inset-top, 0px) - var(--ted-navbar-bottom-reserve, 48px))
  grid-template-areas: |
    "content clock"
  grid-gap: 12px
  padding: 12px
  box-sizing: border-box
cards:
  - type: vertical-stack
    view_layout:
      grid-area: clock
    card_mod:
      style: |
        :host { height: 100%; }
        /* Both cards are absolutely positioned over the full-height clock area (they
           may overlap — that's fine). The weather is pinned to the TOP (content
           height); its content is right-offset, so it lands in the top-right corner
           of the screen. The clock+date card is centered vertically. */
        #root {
          height: 100%;
          position: relative;
        }
        #root > *:nth-child(1) {
          position: absolute;
          top: 0;
          left: 0;
          right: 0;
        }
        #root > *:nth-child(2) {
          position: absolute;
          top: 50%;
          left: 0;
          right: 0;
          transform: translateY(-50%);
        }
        /* DEBUG: gated by the Ted's Cards "Debug mode" setting, which publishes
           `--ted-debug: solid` on the document root (else unset -> outlines are
           `none`). `outline` doesn't add to the box size, so it won't shift the
           layout being debugged. Toggle it in Settings -> General. */
        :host { outline: 2px var(--ted-debug, none) magenta !important; }
        #root > * { outline: 2px var(--ted-debug, none) red !important; }
    cards:
      - type: custom:ted-clock-weather-card
        weather_entity: weather.forecast_home
        show_date: false
        show_clock: false
        hug_content: true
        card_mod:
          style: |
            .cwc { padding: 8px !important; }
            /* DEBUG (gated by the "Debug mode" setting via --ted-debug) */
            ha-card { outline: 2px var(--ted-debug, none) cyan !important; }
            .cwc { outline: 1px var(--ted-debug, none) lime !important; }
      - type: custom:ted-clock-weather-card
        clock_offset: 50
        clock_size: extra_large
        time_format: custom
        time_format_custom: h:MM
        date_offset: 50
        show_weather: false
        card_mod:
          style: |
            .cwc { padding: 8px !important; }
            /* DEBUG (gated by the "Debug mode" setting via --ted-debug) */
            ha-card { outline: 2px var(--ted-debug, none) cyan !important; }
            .cwc { outline: 1px var(--ted-debug, none) lime !important; }
  - !include navbar-autohide.yaml
