# View: Home (Nightstand) — placeholder (custom:grid-layout). path: home-nightstand
# Clock (left) + content (right) side-by-side. Clock is at least 60% wide; the
# content column uses fit-content(40%) so it caps at 40% when it holds a card but
# COLLAPSES TO 0 when empty (letting the clock span the full width). The navbar
# auto-hides on this view.
type: custom:grid-layout
path: home-nightstand
title: Home (Nightstand)
icon: cbi:echo-show-5-gen-2
layout:
  height: calc(100dvh - var(--kiosk-header-height, var(--header-height, 56px)) - var(--safe-area-inset-top, 0px) - var(--ted-navbar-bottom-reserve, 48px))
  grid-template-columns: minmax(60%, 1fr) fit-content(40%)
  grid-template-rows: calc(100dvh - var(--kiosk-header-height, var(--header-height, 56px)) - var(--safe-area-inset-top, 0px) - var(--ted-navbar-bottom-reserve, 48px))
  grid-template-areas: |
    "clock content"
  grid-gap: 12px
  padding: 12px
  box-sizing: border-box
cards:
  - type: vertical-stack
    view_layout:
      grid-area: clock
    card_mod:
      style: |
        :host { height: 100%; }
        /* Fill the full-height clock area; the weather card stays in normal flow
           at the TOP, while the clock+date card is absolutely centered on the
           whole area (= vertically centered on screen). */
        #root {
          height: 100%;
          position: relative;
        }
        #root > *:nth-child(2) {
          position: absolute;
          top: 50%;
          left: 0;
          right: 0;
          transform: translateY(-50%);
        }
    cards:
      - type: custom:ted-clock-weather-card
        weather_entity: weather.forecast_home
        show_date: false
        show_clock: false
        card_mod:
          style: |
            .cwc { padding: 8px !important; }
      - type: custom:ted-clock-weather-card
        clock_offset: 50
        time_format: custom
        time_format_custom: h:MM
        date_offset: 50
        show_weather: false
        card_mod:
          style: |
            .cwc { padding: 8px !important; }
  - !include navbar-autohide.yaml
