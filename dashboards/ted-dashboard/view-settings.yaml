# View: Settings (custom:grid-layout) — path: settings
# A shared Global / This-device scope toggle sits above a Ted Tab Card whose tabs
# are the logical settings sections (each a Ted's Cards Settings card filtered to
# one group, following the shared scope). Requires the Ted's Cards Backend.
# Navbar is a plain card (`- !include navbar.yaml`); position:fixed, no grid-area.
type: custom:grid-layout
path: settings
title: Settings
icon: streamline-ultimate-color:cog
layout:
  height: calc(100dvh - var(--ted-navbar-bottom-reserve, 48px))
  grid-template-columns: 1fr
  grid-template-rows: minmax(0, 1fr)
  grid-template-areas: |
    "main"
  grid-gap: 12px
  padding: 12px
  box-sizing: border-box
cards:
  - type: vertical-stack
    view_layout:
      grid-area: main
    card_mod:
      style: |
        :host { height: 100%; }
        #root {
          height: 100%;
          display: flex;
          flex-direction: column;
          gap: 10px;
          overflow: hidden;
        }
        #root > :last-child { flex: 1 1 auto; min-height: 0; overflow: auto; }
    cards:
      # Shared scope toggle — drives every section card below.
      - type: custom:ted-settings-card
        variant: scope-toggle
        title: Ted's Cards Settings
      # One tab per logical settings section.
      - type: custom:ted-tab-card
        tabs:
          - label: Timers
            icon: mdi:timer-outline
            card: { type: custom:ted-settings-card, sections: [Timers], scope: shared, show_header: false }
          - label: Alarms
            icon: mdi:alarm
            card: { type: custom:ted-settings-card, sections: [Alarms], scope: shared, show_header: false }
          - label: Notifications
            icon: mdi:bell-outline
            card: { type: custom:ted-settings-card, sections: [Notifications], scope: shared, show_header: false }
          - label: Media
            icon: mdi:play-circle-outline
            card: { type: custom:ted-settings-card, sections: [Media], scope: shared, show_header: false }
          - label: Cameras
            icon: mdi:cctv
            slug: cameras
            card: { type: custom:ted-settings-card, sections: [Cameras], scope: shared, show_header: false }
          - label: Navbar
            icon: mdi:dock-bottom
            card: { type: custom:ted-settings-card, sections: [Navbar], scope: shared, show_header: false }
          - label: General
            icon: mdi:tune
            card: { type: custom:ted-settings-card, sections: [General], scope: shared, show_header: false }
          - label: Navigation
            icon: mdi:navigation-variant-outline
            card: { type: custom:ted-settings-card, sections: [Navigation], scope: shared, show_header: false }
  - !include navbar.yaml
