# View: Settings (custom:grid-layout) — path: settings
# A single full-height Ted's Cards Settings card (Global + This device tabs).
# Requires the Ted's Cards Backend integration. Navbar is a plain card in `cards:`
# (`- !include navbar.yaml`); it's position:fixed so it needs no grid-area.
type: custom:grid-layout
path: settings
title: Settings
icon: mdi:cog
layout:
  height: calc(100dvh - var(--ted-navbar-bottom-reserve, 48px))
  grid-template-columns: 1fr
  grid-template-rows: minmax(0, 1fr)
  grid-template-areas: |
    "main"
  grid-gap: 12px
  padding: 12px
  box-sizing: border-box
cards:
  - type: custom:ted-settings-card
    view_layout:
      grid-area: main
    title: Ted's Cards Settings
  - !include navbar.yaml
