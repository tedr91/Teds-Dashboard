# View: Settings (custom:grid-layout) — path: settings
# A single Ted's Cards Settings card with built-in section tabs (one tab per settings
# category) and its own Global / This-device toggle. Honours `?tab=<category>` deep links
# (e.g. the Climate card's "Settings" button → ?tab=temperatures). Requires the Ted's Cards Backend.
# Navbar is a plain card (`- !include ../shared/navbar.yaml`); position:fixed, no grid-area.
type: custom:grid-layout
path: settings
title: Settings
icon: streamline-ultimate-color:cog
layout:
  height: calc(100dvh - var(--ted-navbar-bottom-reserve, 48px))
  grid-template-columns: 1fr
  grid-template-rows: minmax(0, 1fr)
  grid-template-areas: |
    "main"
  grid-gap: 12px
  padding: 12px
  box-sizing: border-box
cards:
  - type: custom:ted-settings-card
    view_layout:
      grid-area: main
    section_tabs: true
    title: Ted's Cards Settings
  - !include ../shared/navbar.yaml