# View: Announce — send spoken announcements to Ted's Dashboard devices/areas.
# path: announce. Content area holds the Ted's Announce card (backend-driven).
# Navbar + background are the shared position:fixed cards.
type: custom:grid-layout
path: announce
title: Announce
icon: streamline-ultimate-color:megaphone
layout: !include ../shared/layout-content.yaml
cards:
  - type: custom:ted-announce-card
    view_layout:
      grid-area: content
    theme: ha
  - !include ../shared/navbar.yaml
  - !include ../shared/background.yaml