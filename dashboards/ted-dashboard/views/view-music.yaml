# View: Music — Music Assistant player (custom:grid-layout). path: music
# The content area holds a ted-music-card that drives droans/mass-player-card
# from this device's Settings → Sounds player. Navbar is a plain card (position:fixed).
type: custom:grid-layout
path: music
title: Music
icon: streamline-ultimate-color:music-note-1
layout: !include ../shared/layout-content.yaml
cards:
  - type: custom:ted-music-card
    view_layout:
      grid-area: content
    player_source: settings
    fill: true
    mass_config:
      expressive: true
      default_section: music_player
      download_local: true
      expressive_scheme: neutral
      queue:
        show_album_covers: true
        show_artist_names: true
      player:
        hide:
          player_selector: true
          power: true
          group_selector: true
        layout:
          hide_labels: true
      media_browser:
        default_section: favorites
        default_enqueue_option: play_now
        favorites:
          show_collection_view: false
          audiobooks:
            enabled: false
          radios:
            enabled: false
          tracks:
            enabled: false
          artists:
            enabled: false
          albums:
            enabled: false
        columns: 4
      players:
        enabled: false
  - !include ../shared/navbar.yaml
  - !include ../shared/background.yaml