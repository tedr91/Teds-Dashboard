# View: Music — Music Assistant player (custom:grid-layout). path: music
# The content area holds a ted-music-card that drives droans/mass-player-card (MASS engine)
# from this device's Settings → Sounds player, in a side-by-side split (player left,
# media browser + queue right). Navbar is a plain card (position:fixed).
type: custom:grid-layout
path: music
title: Music
icon: streamline-ultimate-color:music-note-1
layout: !include ../shared/layout-content.yaml
cards:
  - type: custom:ted-music-card
    view_layout:
      grid-area: content
    player_source: settings
    engine: mass
    fill: true
    # Side-by-side: 60% player (left) + 40% media browser/queue (right). Section enable
    # flags + default_section come from the card's per-engine base, so mass_config below
    # is shared STYLING only (merged into both panes). Collapses to player-only < ~700px.
    split: 60
    mass_config:
      expressive: true
      download_local: true
      expressive_scheme: neutral
      queue:
        show_album_covers: true
        show_artist_names: true
      player:
        hide:
          player_selector: true
          power: true
          group_selector: true
        layout:
          hide_labels: true
      media_browser:
        default_section: favorites
        default_enqueue_option: play_now
        favorites:
          show_collection_view: false
          audiobooks:
            enabled: false
          radios:
            enabled: false
          tracks:
            enabled: false
          artists:
            enabled: false
          albums:
            enabled: false
        columns: 4
    # Right pane (media browser + queue): fewer columns for the narrower pane.
    right_config:
      media_browser:
        columns: 2
  - !include ../shared/navbar.yaml
  - !include ../shared/background.yaml