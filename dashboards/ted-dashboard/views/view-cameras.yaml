# View: Cameras — Ted's Camera Card driven by the per-device Settings list. path: cameras
# The camera card fills the "content" grid-area (like the calendar in Calendar-Month).
# Cameras are chosen per-device in Settings → Cameras; when a device has none available
# the card shows its own empty-state prompt with a "Settings" button. Navbar is a plain
# card (`- !include ../shared/navbar.yaml`), position:fixed so it needs no grid-area.
type: custom:grid-layout
path: cameras
title: Cameras
icon: streamline-ultimate-color:shield-monitor
layout: !include ../shared/layout-content.yaml
cards:
  - type: custom:ted-camera-card
    view_layout:
      grid-area: content
    cameras_source: settings
    fill: true
    show_name: true
  - !include ../shared/navbar.yaml