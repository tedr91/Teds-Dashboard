# View: Music-Idle-Preview — TEMPORARY. path: musicidle.
# Live side-by-side of native YAMP idle-state options for the player pane, so you can pick
# how the left pane should look when NOTHING is playing. The cards only differ while idle
# (nothing playing). Remove this view + its include once you've chosen.
# path uses a single token ("musicidle") so it does NOT join the "music*" navbar group.
type: custom:grid-layout
# Grow with content so the page scrolls through the options.
layout:
  grid-template-columns: minmax(0, 1fr)
  grid-gap: 0
  padding: 12px
  padding-bottom: 96px
path: musicidle
title: Idle Preview
icon: mdi:eye-outline
cards:
  - !include ../shared/background.yaml
  - !include ../shared/navbar.yaml
  - type: grid
    columns: 2
    square: false
    view_layout:
      grid-area: 1 / 1
    cards:
      - type: vertical-stack
        cards:
          - type: markdown
            content: "### Current (idle_screen: default)"
          - type: custom:ted-music-card
            player_source: settings
            engine: yamp
            layout_switcher: false
            yamp_config:
              template: large_modern
              match_theme: true
              card_height: 420
              idle_screen: default
      - type: vertical-stack
        cards:
          - type: markdown
            content: "### Recently Played (idle_screen: search-recently-played)"
          - type: custom:ted-music-card
            player_source: settings
            engine: yamp
            layout_switcher: false
            yamp_config:
              template: large_modern
              match_theme: true
              card_height: 420
              idle_screen: search-recently-played
      - type: vertical-stack
        cards:
          - type: markdown
            content: "### Next Up (idle_screen: search-next-up)"
          - type: custom:ted-music-card
            player_source: settings
            engine: yamp
            layout_switcher: false
            yamp_config:
              template: large_modern
              match_theme: true
              card_height: 420
              idle_screen: search-next-up
      - type: vertical-stack
        cards:
          - type: markdown
            content: "### Collapse on idle (collapse_on_idle: true)"
          - type: custom:ted-music-card
            player_source: settings
            engine: yamp
            layout_switcher: false
            yamp_config:
              template: large_modern
              match_theme: true
              card_height: 420
              collapse_on_idle: true
      - type: vertical-stack
        cards:
          - type: markdown
            content: "### No artwork (artwork_object_fit: no_artwork)"
          - type: custom:ted-music-card
            player_source: settings
            engine: yamp
            layout_switcher: false
            yamp_config:
              template: large_modern
              match_theme: true
              card_height: 420
              artwork_object_fit: no_artwork
