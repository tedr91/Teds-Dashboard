# View: Notifications (custom:grid-layout) — path: notifications
# A single full-height Ted's Notifications card fills the content area.
# Navbar is a plain card (`- !include ../shared/navbar.yaml`); position:fixed, no grid-area.
type: custom:grid-layout
path: notifications
title: Notifications
icon: streamline-ultimate-color:alarm-bell-ring
layout: !include ../shared/layout-content.yaml
cards:
  - type: custom:ted-notification-card
    view_layout:
      grid-area: content
  - !include ../shared/navbar.yaml
