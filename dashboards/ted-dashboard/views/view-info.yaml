# View: Info — placeholder (custom:grid-layout). path: info
# Uses the Welcome view's clock + content layout. The content area holds a
# MessageBox card as the placeholder. Navbar is a plain card (position:fixed).
type: custom:grid-layout
path: info
title: Info
icon: streamline-ultimate-color:information-circle
layout: !include ../shared/layout-content.yaml
cards:
  - type: custom:ted-messagebox-card
    view_layout:
      grid-area: content
    severity: info
    icon: streamline-ultimate-color:information-circle
    title: Info
    message: This is a placeholder view. Content coming soon.
  - !include ../shared/navbar.yaml