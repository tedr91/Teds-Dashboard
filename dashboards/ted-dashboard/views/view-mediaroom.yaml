# View: MediaRoom-Wallpanel (custom:grid-layout) — path: mediaroom-wallpanel
# Navbar is a plain card in `cards:` (`- !include ../shared/navbar.yaml`); position:fixed, no grid-area.
type: custom:grid-layout
path: mediaroom-wallpanel
title: MediaRoom-Wallpanel
icon: streamline-ultimate-color:modern-tv-remote
layout:
  height: calc(100dvh - var(--ted-navbar-bottom-reserve, 48px))
  grid-template-columns: 1fr 1fr
  grid-template-rows: minmax(0, 1fr) minmax(0, 3fr)
  grid-template-areas: |
    "row1col1 row1col2"
    "row2col1 row2col2"
  grid-gap: 12px
  padding: 12px
  box-sizing: border-box
cards:
  - type: custom:ted-av-receiver-card
    view_layout:
      grid-area: row1col2
    header: AV 20
    device_id: 76663392613a5c742b345c404591b6b4
    brand: marantz
    rocker: false
  - type: custom:ted-room-card
    area: media_room
    photo_height: 135
    photo: media_room
    sections:
      - buttons:
          - type: custom:ted-button-card
            name: Watch AppleTV
            icon: streamline-ultimate-color:apple-logo
            show_name: true
            element_order:
              - icon
              - state
              - name
            ted_button_width: 2x
        title: Activities
        icon: streamline-freehand-color:app-window-layout
      - buttons:
          - type: custom:ted-light-card
            entity: light.media_room_ceiling_rear_lights
            name: Rear Lights
            icon: pepicons-print:sun
            name_scale: 80
            state_scale: 80
            icon_scale: 90
            down_tap: decrease
            rocker_effect: false
          - type: custom:ted-button-card
            entity: scene.media_room_main_lights_casual_viewing
            name: TV Lighting
            icon: pepicons-print:television
            tap_action:
              action: toggle
          - type: custom:ted-button-card
            name: Movie Lighting
            entity: scene.media_room_main_lights_movie_viewing_high
            icon: pepicons-print:clapperboard
            icon_scale: 80
            tap_action:
              action: toggle
          - type: custom:ted-button-card
            name: Party Lights
            entity: scene.media_room_main_lights_tokyo
            icon: pepicons-print:microphone-handheld
            icon_scale: 80
            tap_action:
              action: toggle
          - type: custom:ted-button-card
            name: All On/Off
            entity: light.media_room_main_lights
            icon: pepicons-print:power
            icon_scale: 80
        title: Lighting
        icon: streamline-freehand-color:creativity-idea-bulb
    section_layout: tabbed
    brushed: true
    transparency: 15
    view_layout:
      grid-area: row2col1
  - type: custom:ted-novastar-card
    view_layout:
      grid-area: row2col2
    device_id: d8871a137399dbedf2f2dc61ce653bc3
    brand: awall
    preset_order:
      - 1.78:1
      - 2.4:1
      - Double SxS
      - Triple L
      - 1.85:1
      - "2:1"
      - 2.5:1
      - Full Stretched
      - Triple R
    preset_baseline:
      - 1.78:1
      - 1.85:1
      - "2:1"
      - 2.4:1
      - 2.5:1
      - Full Stretched
      - Double SxS
      - Triple L
      - Triple R
    logo_variant: horizontal
    logo_scale: 125
    show_name: false
    max_rows: 1
  - !include ../shared/navbar.yaml
  - !include ../shared/background.yaml