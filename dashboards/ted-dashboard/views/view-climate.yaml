# View: Climate — placeholder (custom:grid-layout). path: climate
# Uses the Welcome view's clock + content layout. The content area holds a
# MessageBox card as the placeholder. Navbar is a plain card (position:fixed).
type: custom:grid-layout
path: climate
title: Climate
icon: streamline-ultimate-color:temperature-thermometer-high
layout:
  height: calc(100dvh - var(--kiosk-header-height, var(--header-height, 56px)) - var(--safe-area-inset-top, 0px) - var(--ted-navbar-bottom-reserve, 48px))
  grid-template-columns: 1fr
  grid-template-rows: >-
    minmax(0, auto)
    minmax(0, 1fr)
  grid-template-areas: |
    "clock"
    "content"
  grid-gap: 12px
  padding: 12px
  box-sizing: border-box
cards:
  - !include ../shared/clock-header.yaml
  - type: custom:ted-messagebox-card
    view_layout:
      grid-area: content
    severity: info
    icon: streamline-ultimate-color:temperature-thermometer-high
    title: Climate
    message: This is a placeholder view. Content coming soon.
  - !include ../shared/navbar.yaml