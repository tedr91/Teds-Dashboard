# Shared Ted's Navbar sections - the SINGLE source of the bar's contents.
# Referenced by navbar.yaml (normal) and navbar-autohide.yaml (auto-hide) via
# 'sections: !include navbar-sections.yaml', so both bars share one item list.
- placement: left
  align: left
  items:
    - type: datetime
      display: date
      date_format: ddd, MMMM D
      tap_navigate: calendar_dashboard
    - type: weather
      entity: weather.forecast_home
      tap_navigate: weather_dashboard
- placement: center
  align: center
  items:
    - type: custom:ted-button-card
      icon_scale: 140
      icon_color: none
      transparency: 40
      tap_action:
        action: navigate-dashboard
        dashboard: home_dashboard
      name: Home-Tablet
      icon: streamline-freehand-color:home-chimney-2
      background: light-grey
    - type: custom:ted-button-card
      icon: streamline-freehand-color:calendar-date
      icon_scale: 140
      icon_color: none
      transparency: 40
      tap_action:
        action: navigate
        navigation_path: /ted-dashboard/calendar-week
      name: Calendar-Week
      background: light-grey
    - type: custom:ted-button-card
      icon_scale: 140
      icon_color: none
      transparency: 40
      tap_action:
        action: navigate-dashboard
