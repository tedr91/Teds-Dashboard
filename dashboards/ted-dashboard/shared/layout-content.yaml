# Shared view layout — the single full-height "content" grid, the SINGLE source
# for every view that fills the whole content area with one card (no clock header).
# Consume it as the value of a view's `layout:` key:
#   layout: !include ../shared/layout-content.yaml
# The consuming card targets `grid-area: content`.
height: calc(100dvh - var(--ted-navbar-header-reserve, var(--kiosk-header-height, var(--header-height, 56px))) - var(--safe-area-inset-top, 0px) - var(--ted-navbar-bottom-reserve, 48px))
grid-template-columns: minmax(0, 1fr)
grid-template-rows: minmax(0, 1fr)
grid-template-areas: |
  "content"
grid-gap: 12px
padding: 12px
box-sizing: border-box
# grid-layout gives every card `margin: 4px 4px 8px` (= 12px vertical). A content card
# that fills `height: 100%` of its cell then overflows the cell by that 12px. Zero it so
# cards fit their cell exactly; the 12px grid padding provides the (consistent) insets.
"--masonry-view-card-margin": "0px"
