# Shared view layout — the single full-height "content" grid, the SINGLE source
# for every view that fills the whole content area with one card (no clock header).
# Consume it as the value of a view's `layout:` key:
#   layout: !include ../shared/layout-content.yaml
# The consuming card targets `grid-area: content`.
height: calc(100dvh - var(--kiosk-header-height, var(--header-height, 56px)) - var(--safe-area-inset-top, 0px) - var(--ted-navbar-bottom-reserve, 48px))
grid-template-columns: 1fr
grid-template-rows: calc(100dvh - var(--kiosk-header-height, var(--header-height, 56px)) - var(--safe-area-inset-top, 0px) - var(--ted-navbar-bottom-reserve, 48px))
grid-template-areas: |
  "content"
grid-gap: 12px
padding: 12px
box-sizing: border-box
