# Ted Dashboard — entry file (yaml-mode dashboard `ted-dashboard`).
#
# Referenced from /config/configuration.yaml:
#   lovelace:
#     dashboards:
#       ted-dashboard:
#         mode: yaml
#         filename: dashboards/ted-dashboard.yaml
#
# !include paths below are relative to THIS file's directory (dashboards/), so the
# partials live under dashboards/ted-dashboard/, organized into:
#   shared/      — reused partials (navbar, clock-header)
#   views-home/  — the per-device "home" views
#   views/       — all the other views
views:
  - !include ted-dashboard/views/view-welcome.yaml
  - !include ted-dashboard/views-home/view-home-nightstand.yaml
  - !include ted-dashboard/views-home/view-home-wallpanel-h.yaml
  - !include ted-dashboard/views-home/view-home-wallpanel-v.yaml
  - !include ted-dashboard/views-home/view-home-handheld.yaml
  - !include ted-dashboard/views/view-cameras.yaml
  - !include ted-dashboard/views/view-vision.yaml
  - !include ted-dashboard/views/view-climate.yaml
  - !include ted-dashboard/views/view-weather.yaml
  - !include ted-dashboard/views/view-music.yaml
  - !include ted-dashboard/views/view-photos.yaml
  - !include ted-dashboard/views/view-calendar-month.yaml
  - !include ted-dashboard/views/view-calendar-week.yaml
  - !include ted-dashboard/views/view-alarms-timers.yaml
  - !include ted-dashboard/views/view-assist-response.yaml
  - !include ted-dashboard/views/view-announce.yaml
  - !include ted-dashboard/views/view-notifications.yaml
  - !include ted-dashboard/views/view-settings.yaml
